{% extends 'base.html' %}

{% block title %}
Authors
{% endblock %}

{% block content %}

    <h2>Authors</h2>

    {% for author in authors %}
        <p>
            <a href="{% url 'author_detail' author.pk %}">
                {{ author.fullname }}
            </a>
        </p>
    {% empty %}
        <p>There are no authors yet.</p>
    {% endfor %}

{% endblock %}
