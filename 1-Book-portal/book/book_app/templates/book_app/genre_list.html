{% extends 'base.html' %}

{% block title %}
Genres
{% endblock %}

{% block content %}

    <h2>Genres</h2>

    {% for genre in genres %}
        <p>
            <a href="{% url 'genre_detail' genre.pk %}">
                {{ genre.name }}
            </a>
        </p>
    {% empty %}
        <p>There are no genres yet.</p>
    {% endfor %}

{% endblock %}
