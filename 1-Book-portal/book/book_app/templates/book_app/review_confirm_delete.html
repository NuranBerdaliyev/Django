{% extends 'base.html' %}

{% block title %}
Delete review
{% endblock %}

{% block content %}

    <h2>Delete review</h2>

    <p>
        Are you sure you want to delete your review for
        <strong>"{{ object.book.title }}"</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, delete</button>
    </form>

    <p>
        <a href="{% url 'book_detail' object.book.pk %}">
            Cancel
        </a>
    </p>

{% endblock %}
