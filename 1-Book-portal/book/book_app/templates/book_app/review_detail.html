{% extends 'base.html' %}

{% block title %}
Review of {{ review.added_by }} for {{ review.book }}
{% endblock %}

{% block content %}
<h1>Review</h1>

<p>User: {{ review.added_by }}</p>

<p>Book: {{ review.book }}</p>

<p>Rating: {{ review.rating }}</p>

<p>{{ review.text }}</p>

<p>{{ review.created_at }}</p>

{% endblock %}
